# 每日两次自动抓取：北京时间 08:00 与 20:00（GitHub Actions 使用 UTC，即 0 点和 12 点）
# 抓取结果写入 data/ 并推回仓库 → GitHub Pages 自动更新 → 手机上的 App 自动拿到新数据
name: 每日数据更新

on:
  schedule:
    - cron: '0 0,12 * * *'   # 每天 08:00 / 20:00（北京时间，UTC+8）
  workflow_dispatch: {}       # 也可以在 GitHub 仓库页面手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 抓取并生成数据
        run: node fetcher/src/index.js

      - name: 提交并推送数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: 每日数据更新 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
